networks:
  mail-network:
    driver: bridge

volumes:
  zimbra-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./store

services:

  zimbra:
    image: zimbra-docker:latest
    container_name: zimbra-mail
    hostname: mail.entreprise.tn
    restart: unless-stopped
    networks:
      - mail-network
    ports:
      - "25:25"
      - "80:80"
      - "110:110"
      - "143:143"
      - "443:443"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
      - "7071:7071"
      - "8080:8080"
    volumes:
      - zimbra-data:/opt/zimbra
      - ./backup:/backup
    environment:
      - ZIMBRA_DOMAIN=entreprise.tn
      - ZIMBRA_HOST=mail.entreprise.tn
      - ZIMBRA_ADMIN_PASS=Admin@Zimbra2025
      - ZIMBRA_TIMEZONE=Africa/Tunis
    privileged: true
    mem_limit: 4g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - mail-network
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - mail-network
    ports:
      - "9091:9090"
    volumes:
      - ./conf/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - mail-network
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=AdminSecure123
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus